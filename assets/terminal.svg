<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="100%" height="390" fill="none">
  <defs>
    <!-- Background Gradient: Arctic Glacier Dark -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030814"/>
      <stop offset="50%" stop-color="#061527"/>
      <stop offset="100%" stop-color="#02060e"/>
    </linearGradient>

    <!-- Border Gradient: Ice Blue to Mint Blue -->
    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Chip Circuit Gradient -->
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>

    <pattern id="term-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#7dd3fc" fill-opacity="0.12"/>
    </pattern>

    <style>
      text {
        font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Roboto Mono', monospace;
      }
      .cursor {
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Frame -->
  <rect x="2" y="2" width="916" height="386" rx="16" fill="url(#term-bg)"/>
  <rect x="2" y="2" width="916" height="386" rx="16" fill="url(#term-grid)"/>
  <rect x="2" y="2" width="916" height="386" rx="16" stroke="url(#term-border)" stroke-width="1.6"/>

  <!-- Top Titlebar -->
  <rect x="2" y="2" width="916" height="38" rx="16" fill="#071527" fill-opacity="0.95"/>
  <line x1="2" y1="40" x2="918" y2="40" stroke="#132c47" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="26" cy="21" r="5.5" fill="#ff5f56"/>
  <circle cx="44" cy="21" r="5.5" fill="#ffbd2e"/>
  <circle cx="62" cy="21" r="5.5" fill="#2dd4bf"/>

  <!-- Title & Branch -->
  <text x="86" y="25" fill="#7dd3fc" font-size="11.5" font-weight="600">terminal — zsh — 920x390</text>
  <rect x="740" y="10" width="150" height="20" rx="5" fill="#0b1e33" stroke="#1b3a5c" stroke-width="0.8"/>
  <text x="752" y="24" fill="#5eead4" font-size="10.5" font-weight="600">git:(main) ⚡ v2.6.0</text>

  <!-- Command Prompt Line -->
  <g transform="translate(32, 70)">
    <text font-size="13.5">
      <tspan fill="#7dd3fc" font-weight="700">carleel@cyberdeck</tspan>
      <tspan fill="#475569">:</tspan>
      <tspan fill="#5eead4">~</tspan>
      <tspan fill="#475569">$</tspan>
      <tspan fill="#f0f9ff" font-weight="500"> neofetch --engineer --system=telemetry</tspan>
    </text>
  </g>

  <!-- Left Column: Geometric Cyber Chip / Mechatronics HUD (Ice & Mint) -->
  <g transform="translate(36, 100)">
    <!-- Outer Chip Frame -->
    <rect x="15" y="15" width="180" height="180" rx="16" fill="#071527" fill-opacity="0.8" stroke="url(#chip-grad)" stroke-width="1.8"/>
    <rect x="35" y="35" width="140" height="140" rx="10" fill="#030814" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1"/>

    <!-- Center Processor Core -->
    <rect x="65" y="65" width="80" height="80" rx="8" fill="url(#chip-grad)" fill-opacity="0.15" stroke="url(#chip-grad)" stroke-width="1.5"/>
    <text x="105" y="103" fill="#7dd3fc" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">CARLEEL</text>
    <text x="105" y="120" fill="#5eead4" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="2">ROBOTICS</text>

    <!-- Circuit Pins - Top -->
    <line x1="45" y1="5" x2="45" y2="15" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="75" y1="5" x2="75" y2="15" stroke="#38bdf8" stroke-width="2"/>
    <line x1="105" y1="5" x2="105" y2="15" stroke="#5eead4" stroke-width="2"/>
    <line x1="135" y1="5" x2="135" y2="15" stroke="#2dd4bf" stroke-width="2"/>
    <line x1="165" y1="5" x2="165" y2="15" stroke="#99f6e4" stroke-width="2"/>

    <!-- Circuit Pins - Bottom -->
    <line x1="45" y1="195" x2="45" y2="205" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="75" y1="195" x2="75" y2="205" stroke="#38bdf8" stroke-width="2"/>
    <line x1="105" y1="195" x2="105" y2="205" stroke="#5eead4" stroke-width="2"/>
    <line x1="135" y1="195" x2="135" y2="205" stroke="#2dd4bf" stroke-width="2"/>
    <line x1="165" y1="195" x2="165" y2="205" stroke="#99f6e4" stroke-width="2"/>

    <!-- Circuit Pins - Left -->
    <line x1="5" y1="45" x2="15" y2="45" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="5" y1="75" x2="15" y2="75" stroke="#38bdf8" stroke-width="2"/>
    <line x1="5" y1="105" x2="15" y2="105" stroke="#5eead4" stroke-width="2"/>
    <line x1="5" y1="135" x2="15" y2="135" stroke="#2dd4bf" stroke-width="2"/>
    <line x1="5" y1="165" x2="15" y2="165" stroke="#99f6e4" stroke-width="2"/>

    <!-- Circuit Pins - Right -->
    <line x1="195" y1="45" x2="205" y2="45" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="195" y1="75" x2="205" y2="75" stroke="#38bdf8" stroke-width="2"/>
    <line x1="195" y1="105" x2="205" y2="105" stroke="#5eead4" stroke-width="2"/>
    <line x1="195" y1="135" x2="205" y2="135" stroke="#2dd4bf" stroke-width="2"/>
    <line x1="195" y1="165" x2="205" y2="165" stroke="#99f6e4" stroke-width="2"/>

    <!-- Status badge under chip -->
    <rect x="25" y="218" width="160" height="24" rx="6" fill="#0b1e33" fill-opacity="0.9" stroke="#164e63" stroke-width="1"/>
    <text x="105" y="234" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">SILICON ⨁ AI CONVERGENCE</text>
  </g>

  <!-- Right Column: System Spec Fields -->
  <g transform="translate(270, 102)" font-size="12.5" font-weight="500">
    <!-- Row 1: Engineer Name -->
    <g transform="translate(0, 16)">
      <text fill="#7dd3fc" font-weight="700">Engineer</text>
      <text x="115" fill="#475569">→</text>
      <text x="135" fill="#f0f9ff" font-weight="600">Jimoh Khalilulah Olamilekan <tspan fill="#475569">(</tspan><tspan fill="#5eead4">Carleel</tspan><tspan fill="#475569">)</tspan></text>
    </g>

    <!-- Row 2: Education -->
    <g transform="translate(0, 40)">
      <text fill="#5eead4" font-weight="700">Education</text>
      <text x="115" fill="#475569">→</text>
      <text x="135" fill="#bae6fd">B.Eng. Mechatronics Engineering @ LASUSTECH</text>
    </g>

    <!-- Row 3: Specialization -->
    <g transform="translate(0, 64)">
      <text fill="#38bdf8" font-weight="700">Discipline</text>
      <text x="115" fill="#475569">→</text>
      <text x="135" fill="#e0f2fe">Autonomous AI Systems, Embedded IoT &amp; Robotics</text>
    </g>

    <!-- Row 4: Hardware -->
    <g transform="translate(0, 88)">
      <text fill="#2dd4bf" font-weight="700">Hardware</text>
      <text x="115" fill="#475569">→</text>
      <text x="135" fill="#e0f2fe">ESP32-S3/C3, Raspberry Pi 4B, STM32, Arduino, FreeCAD</text>
    </g>

    <!-- Row 5: Firmware/Stack -->
    <g transform="translate(0, 112)">
      <text fill="#7dd3fc" font-weight="700">Languages</text>
      <text x="115" fill="#475569">→</text>
      <text x="135" fill="#e0f2fe">C/C++, Python 3.12, Rust, TypeScript, FreeRTOS, Bash</text>
    </g>

    <!-- Row 6: AI / Agentic -->
    <g transform="translate(0, 136)">
      <text fill="#5eead4" font-weight="700">AI / Agents</text>
      <text x="115" fill="#475569">→</text>
      <text x="135" fill="#e0f2fe">Hermes Autonomous Platform, Model Context Protocol (MCP)</text>
    </g>

    <!-- Row 7: Flagships -->
    <g transform="translate(0, 160)">
      <text fill="#38bdf8" font-weight="700">Flagships</text>
      <text x="115" fill="#475569">→</text>
      <text x="135" fill="#bae6fd">Tankbot 2025, ESP32 Smart Panel, BizLift AI, AutoPay NG</text>
    </g>

    <!-- Row 8: Location / Status -->
    <g transform="translate(0, 184)">
      <text fill="#5eead4" font-weight="700">Status</text>
      <text x="115" fill="#475569">→</text>
      <text x="135" fill="#5eead4" font-weight="600">🟢 Shipping Production Systems • Open for Global Collaborations</text>
    </g>

    <!-- Ice Blue to Mint Blue Palette Pills -->
    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="34" height="12" rx="3" fill="#071527"/>
      <rect x="40" y="0" width="34" height="12" rx="3" fill="#0284c7"/>
      <rect x="80" y="0" width="34" height="12" rx="3" fill="#38bdf8"/>
      <rect x="120" y="0" width="34" height="12" rx="3" fill="#7dd3fc"/>
      <rect x="160" y="0" width="34" height="12" rx="3" fill="#bae6fd"/>
      <rect x="200" y="0" width="34" height="12" rx="3" fill="#99f6e4"/>
      <rect x="240" y="0" width="34" height="12" rx="3" fill="#5eead4"/>
      <rect x="280" y="0" width="34" height="12" rx="3" fill="#2dd4bf"/>
      <rect x="320" y="0" width="6" height="12" fill="#7dd3fc" class="cursor"/>
    </g>
  </g>
</svg>
