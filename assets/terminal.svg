<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="100%" height="390" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Logo / Circuit Gradient -->
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <pattern id="term-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#38bdf8" fill-opacity="0.1"/>
    </pattern>

    <style>
      text {
        font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Roboto Mono', 'Courier New', monospace;
      }
      .cursor {
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Frame -->
  <rect x="2" y="2" width="916" height="386" rx="16" fill="url(#term-bg)"/>
  <rect x="2" y="2" width="916" height="386" rx="16" fill="url(#term-grid)"/>
  <rect x="2" y="2" width="916" height="386" rx="16" stroke="url(#term-border)" stroke-width="1.5"/>

  <!-- Top Titlebar -->
  <rect x="2" y="2" width="916" height="38" rx="16" fill="#0b1120" fill-opacity="0.9"/>
  <line x1="2" y1="40" x2="918" y2="40" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="26" cy="21" r="5.5" fill="#ff5f56"/>
  <circle cx="44" cy="21" r="5.5" fill="#ffbd2e"/>
  <circle cx="62" cy="21" r="5.5" fill="#27c93f"/>

  <!-- Title & Branch -->
  <text x="86" y="25" fill="#94a3b8" font-size="11.5" font-weight="600">terminal — zsh — 920x390</text>
  <rect x="740" y="10" width="150" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.75"/>
  <text x="752" y="24" fill="#38bdf8" font-size="10.5" font-weight="600">git:(main) ⚡ v2.6.0</text>

  <!-- Command Prompt Line -->
  <g transform="translate(32, 70)">
    <text font-size="13.5">
      <tspan fill="#38bdf8" font-weight="700">carleel@cyberdeck</tspan>
      <tspan fill="#64748b">:</tspan>
      <tspan fill="#a78bfa">~</tspan>
      <tspan fill="#64748b">$</tspan>
      <tspan fill="#f1f5f9" font-weight="500"> neofetch --engineer --system=telemetry</tspan>
    </text>
  </g>

  <!-- Left Column: Geometric Cyber Chip / Mechatronics HUD -->
  <g transform="translate(36, 100)">
    <!-- Outer Chip Frame -->
    <rect x="15" y="15" width="180" height="180" rx="16" fill="#0f172a" fill-opacity="0.7" stroke="url(#chip-grad)" stroke-width="1.75"/>
    <rect x="35" y="35" width="140" height="140" rx="10" fill="#070a13" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Center Processor Core -->
    <rect x="65" y="65" width="80" height="80" rx="8" fill="url(#chip-grad)" fill-opacity="0.15" stroke="url(#chip-grad)" stroke-width="1.5"/>
    <text x="105" y="103" fill="#38bdf8" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">CARLEEL</text>
    <text x="105" y="120" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="2">ROBOTICS</text>

    <!-- Circuit Pins - Top -->
    <line x1="45" y1="5" x2="45" y2="15" stroke="#38bdf8" stroke-width="2"/>
    <line x1="75" y1="5" x2="75" y2="15" stroke="#38bdf8" stroke-width="2"/>
    <line x1="105" y1="5" x2="105" y2="15" stroke="#818cf8" stroke-width="2"/>
    <line x1="135" y1="5" x2="135" y2="15" stroke="#c084fc" stroke-width="2"/>
    <line x1="165" y1="5" x2="165" y2="15" stroke="#34d399" stroke-width="2"/>

    <!-- Circuit Pins - Bottom -->
    <line x1="45" y1="195" x2="45" y2="205" stroke="#38bdf8" stroke-width="2"/>
    <line x1="75" y1="195" x2="75" y2="205" stroke="#38bdf8" stroke-width="2"/>
    <line x1="105" y1="195" x2="105" y2="205" stroke="#818cf8" stroke-width="2"/>
    <line x1="135" y1="195" x2="135" y2="205" stroke="#c084fc" stroke-width="2"/>
    <line x1="165" y1="195" x2="165" y2="205" stroke="#34d399" stroke-width="2"/>

    <!-- Circuit Pins - Left -->
    <line x1="5" y1="45" x2="15" y2="45" stroke="#38bdf8" stroke-width="2"/>
    <line x1="5" y1="75" x2="15" y2="75" stroke="#38bdf8" stroke-width="2"/>
    <line x1="5" y1="105" x2="15" y2="105" stroke="#818cf8" stroke-width="2"/>
    <line x1="5" y1="135" x2="15" y2="135" stroke="#c084fc" stroke-width="2"/>
    <line x1="5" y1="165" x2="15" y2="165" stroke="#34d399" stroke-width="2"/>

    <!-- Circuit Pins - Right -->
    <line x1="195" y1="45" x2="205" y2="45" stroke="#38bdf8" stroke-width="2"/>
    <line x1="195" y1="75" x2="205" y2="75" stroke="#38bdf8" stroke-width="2"/>
    <line x1="195" y1="105" x2="205" y2="105" stroke="#818cf8" stroke-width="2"/>
    <line x1="195" y1="135" x2="205" y2="135" stroke="#c084fc" stroke-width="2"/>
    <line x1="195" y1="165" x2="205" y2="165" stroke="#34d399" stroke-width="2"/>

    <!-- Status badge under chip -->
    <rect x="25" y="218" width="160" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="105" y="234" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">SILICON ⨁ AI CONVERGENCE</text>
  </g>

  <!-- Right Column: System Spec Fields -->
  <g transform="translate(270, 102)" font-size="12.5" font-weight="500">
    <!-- Row 1: Engineer -->
    <g transform="translate(0, 16)">
      <text fill="#38bdf8" font-weight="700">Engineer</text>
      <text x="115" fill="#64748b">→</text>
      <text x="135" fill="#f8fafc" font-weight="600">Famakinwa Adedeji <tspan fill="#64748b">(</tspan><tspan fill="#38bdf8">Carleel</tspan><tspan fill="#64748b">)</tspan></text>
    </g>

    <!-- Row 2: Education -->
    <g transform="translate(0, 40)">
      <text fill="#818cf8" font-weight="700">Education</text>
      <text x="115" fill="#64748b">→</text>
      <text x="135" fill="#cbd5e1">B.Eng. Mechatronics Engineering @ LASUSTECH</text>
    </g>

    <!-- Row 3: Specialization -->
    <g transform="translate(0, 64)">
      <text fill="#a78bfa" font-weight="700">Discipline</text>
      <text x="115" fill="#64748b">→</text>
      <text x="135" fill="#cbd5e1">Autonomous AI Systems, Embedded IoT &amp; Robotics</text>
    </g>

    <!-- Row 4: Hardware -->
    <g transform="translate(0, 88)">
      <text fill="#34d399" font-weight="700">Hardware</text>
      <text x="115" fill="#64748b">→</text>
      <text x="135" fill="#e2e8f0">ESP32-S3/C3, Raspberry Pi 4B, STM32, Arduino, FreeCAD</text>
    </g>

    <!-- Row 5: Firmware/Stack -->
    <g transform="translate(0, 112)">
      <text fill="#fbbf24" font-weight="700">Languages</text>
      <text x="115" fill="#64748b">→</text>
      <text x="135" fill="#e2e8f0">C/C++, Python 3.12, Rust, TypeScript, FreeRTOS, Bash</text>
    </g>

    <!-- Row 6: AI / Agentic -->
    <g transform="translate(0, 136)">
      <text fill="#f43f5e" font-weight="700">AI / Agents</text>
      <text x="115" fill="#64748b">→</text>
      <text x="135" fill="#e2e8f0">Hermes Autonomous Platform, Model Context Protocol (MCP)</text>
    </g>

    <!-- Row 7: Flagships -->
    <g transform="translate(0, 160)">
      <text fill="#38bdf8" font-weight="700">Flagships</text>
      <text x="115" fill="#64748b">→</text>
      <text x="135" fill="#93c5fd">Tankbot 2025, ESP32 Smart Panel, BizLift AI, AutoPay NG</text>
    </g>

    <!-- Row 8: Location / Status -->
    <g transform="translate(0, 184)">
      <text fill="#34d399" font-weight="700">Status</text>
      <text x="115" fill="#64748b">→</text>
      <text x="135" fill="#34d399" font-weight="600">🟢 Shipping Production Systems • Open for Global Collaborations</text>
    </g>

    <!-- Retro Terminal Color Palette Pills -->
    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="34" height="12" rx="3" fill="#0f172a"/>
      <rect x="40" y="0" width="34" height="12" rx="3" fill="#ef4444"/>
      <rect x="80" y="0" width="34" height="12" rx="3" fill="#22c55e"/>
      <rect x="120" y="0" width="34" height="12" rx="3" fill="#eab308"/>
      <rect x="160" y="0" width="34" height="12" rx="3" fill="#3b82f6"/>
      <rect x="200" y="0" width="34" height="12" rx="3" fill="#a855f7"/>
      <rect x="240" y="0" width="34" height="12" rx="3" fill="#06b6d4"/>
      <rect x="280" y="0" width="34" height="12" rx="3" fill="#f8fafc"/>
      <rect x="320" y="0" width="6" height="12" fill="#38bdf8" class="cursor"/>
    </g>
  </g>
</svg>
